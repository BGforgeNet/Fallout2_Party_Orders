name: build

on:
  push:
  pull_request:

env:
  SFALL_VERSION: 4.5.1 # as in extra/env.sh

jobs:
  build:
    if: github.actor != 'bgforge-hive' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0

      - name: Install packages
        run: sudo DEBIAN_FRONTEND=noninteractive eatmydata apt-get install -o=Dpkg::Use-Pty=0 -y crudini dos2unix gcc p7zip

      # SourceForge mirrors are slow at times; the sfall archive only changes with its version.
      - name: Cache downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: extra/downloads
          key: downloads-sfall-${{ env.SFALL_VERSION }}

      - name: Build and package
        run: |
          set -xeu -o pipefail
          . extra/env.sh
          ./extra/prepare.sh
          set -xeu -o pipefail
          ./extra/buildall.sh
          ./extra/package.sh

      - name: Upload artifacts - main zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          compression-level: 0 # the zip is compressed already
          name: party_orders.zip
          path: party_orders*.zip
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            party_orders*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
